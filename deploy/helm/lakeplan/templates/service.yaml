apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakeplan.fullname" . }}
  labels:
    {{- include "lakeplan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lakeplan.selectorLabels" . | nindent 4 }}
